# PR과 develop 푸시에서 린트·타입·테스트를 돌린다.
# 지금까지 이 검사를 자동으로 돌리는 워크플로가 없어서, 머지 전에 사람이 로컬에서
# 직접 `npm run lint` / `typecheck` / `test`를 돌려야 했다.
name: CI

on:
  pull_request:
    # PR의 대상 브랜치를 바꾸면(예: main → develop) 새 병합 결과를 다시 검사해야 한다.
    # 제목·본문만 고친 edited는 아래 job의 if에서 걸러 낸다.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

# 같은 브랜치에 푸시가 몰리면 이전 실행은 버린다.
# 그룹 기준은 아래 job 조건과 같게 둔다 — 검사를 건너뛰는 edited(제목·본문만 수정) 실행만 'edit'으로
# 떼어 내고, 대상 브랜치가 바뀐 edited는 실제 검사와 같은 'run' 그룹에 남긴다.
# 건너뛰는 실행이 진행·대기 중인 검사를 대체하지 못하게 하려는 것이다.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'edit' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test
    # edited 중에서도 대상 브랜치가 실제로 바뀐 경우에만 새로 검사한다.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json의 engines와 맞춘다.
          node-version: 22
          cache: npm

      # package-lock.json 기준으로 설치해 로컬과 같은 의존성 트리를 쓴다.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen`이 먼저 돌아 route 타입을 만든다(typecheck 스크립트에 포함).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # 타입 검사로는 잡히지 않는 RSC 경계·CSS 모듈 오류까지 확인한다.
      # 빌드에는 DB·시크릿이 필요 없다(모든 페이지가 동적 렌더링).
      - name: Build
        run: npm run build
